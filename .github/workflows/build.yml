name: Build WestPlay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install UI dependencies and build UI
        run: |
          npm --prefix ui install
          npm --prefix ui run build:release

      - name: Build WestPlay Plugin and Host App
        run: |
          cargo build --release -p westplay-plugin -p westplay-app

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-dist -Force
          Copy-Item "target/release/westplay.exe" -Destination "release-dist/"
          Copy-Item "target/release/westplay.dll" -Destination "release-dist/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-ATS-Release
          path: release-dist/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ats-cascadia-v2.1.4
          name: "WestPlay ATS Freightliner Edition"
          body: "WestPlay modified and compiled for American Truck Simulator and Freightliner Cascadia trucks."
          files: |
            release-dist/westplay.exe
            release-dist/westplay.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}